openapi: 3.1.0
info:
  title: Mongle Spoon API
  version: 1.1.1
  summary: Backend for saving and looking up baby food recipes.
  description: |
    The contract the frontend services layer (`frontend/src/services/types.ts`,
    `RecipeService`) expects from the FastAPI backend.

    - Reading is public. Creating, updating, pinning, recording when a recipe
      was made and deleting need the admin
      password (the server's `ADMIN_PASSWORD`), sent as
      `Authorization: Bearer <password>`. When `ADMIN_PASSWORD` is unset,
      every write returns 503.
    - JSON field names are camelCase, matching the frontend types.
    - Timestamps are ISO 8601 strings in UTC (e.g. `2026-09-30T08:15:00.000Z`).
      Calendar dates (`lastMadeOn`) are `YYYY-MM-DD`, with no time zone.
servers:
  - url: http://localhost:8000/api
    description: Local development
  - url: /api
    description: Same origin, when the backend also serves the frontend (Docker image)

# Reads are public; write operations declare `adminPassword` themselves.
security: []

tags:
  - name: recipes
    description: Baby food recipes (create, read, update, delete, pin, last made, search, filter).
  - name: auth
    description: Checking the admin password that protects writes.

paths:
  /recipes:
    get:
      tags: [recipes]
      operationId: listRecipes
      summary: List recipes
      description: |
        Returns pinned recipes first (by `pinnedAt`, most recently pinned
        first), then the rest by the later of `lastMadeOn` (as midnight UTC
        of that day) and `updatedAt`, most recent first; recipes never made
        use `updatedAt`. On the same day, an update counts as more recent
        than being made. Ties are sorted by `updatedAt`, most recent first,
        then by `id`.
        `search` and `mealTime` combine with AND, and apply to pinned recipes
        too. With neither, all recipes are returned.
      parameters:
        - name: search
          in: query
          required: false
          description: |
            Case-insensitive substring match against the recipe name OR any
            ingredient name. Leading/trailing whitespace is ignored; an empty
            or whitespace-only value matches everything.
          schema:
            type: string
          example: 브로콜리
        - name: mealTime
          in: query
          required: false
          description: Only return recipes whose `mealTimes` contains this value. Omit for all (전체).
          schema:
            $ref: "#/components/schemas/MealTime"
      responses:
        "200":
          description: Matching recipes. An empty array when nothing matches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipe"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [recipes]
      operationId: createRecipe
      summary: Create a recipe
      description: The server assigns `id`, and sets `createdAt` and `updatedAt` to the same current time.
      security:
        - adminPassword: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "201":
          description: The created recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/WritesDisabled"
        "422":
          $ref: "#/components/responses/ValidationError"

  /recipes/{recipeId}:
    parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [recipes]
      operationId: getRecipe
      summary: Get one recipe
      description: The frontend maps a 404 to `null`.
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [recipes]
      operationId: updateRecipe
      summary: Replace a recipe
      description: |
        Full replacement of every editable field. `id`, `createdAt`,
        `pinnedAt`, `lastMadeOn` and `leftover` are kept; `updatedAt` is set to the
        current time.
      security:
        - adminPassword: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: The updated recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/WritesDisabled"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [recipes]
      operationId: deleteRecipe
      summary: Delete a recipe
      description: Idempotent. Deleting an id that does not exist also returns 204, matching the mock.
      security:
        - adminPassword: []
      responses:
        "204":
          description: Deleted (or already absent). No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/WritesDisabled"

  /recipes/{recipeId}/pin:
    parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [recipes]
      operationId: pinRecipe
      summary: Pin a recipe to the top of the list
      description: |
        Sets `pinnedAt` to the current time. Pinning a recipe that is already
        pinned keeps its `pinnedAt`. `updatedAt` does not change.
      security:
        - adminPassword: []
      responses:
        "200":
          description: The pinned recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/WritesDisabled"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [recipes]
      operationId: unpinRecipe
      summary: Unpin a recipe
      description: |
        Sets `pinnedAt` to null (also when it was not pinned). `updatedAt`
        does not change.
      security:
        - adminPassword: []
      responses:
        "200":
          description: The unpinned recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/WritesDisabled"
        "404":
          $ref: "#/components/responses/NotFound"

  /recipes/{recipeId}/last-made:
    parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [recipes]
      operationId: setLastMade
      summary: Record the day a recipe was last made
      description: |
        Sets `lastMadeOn` to the given day, replacing the previous one (an
        earlier day is allowed, to fix a mistake). The client picks the day
        in the user's time zone. `updatedAt` does not change.
      security:
        - adminPassword: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LastMadeInput"
      responses:
        "200":
          description: The updated recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/WritesDisabled"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [recipes]
      operationId: clearLastMade
      summary: Clear the day a recipe was last made
      description: |
        Sets `lastMadeOn` to null (also when it was already null).
        `updatedAt` does not change.
      security:
        - adminPassword: []
      responses:
        "200":
          description: The updated recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/WritesDisabled"
        "404":
          $ref: "#/components/responses/NotFound"

  /recipes/{recipeId}/leftover:
    parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [recipes]
      operationId: setLeftover
      summary: Record how much of a recipe is left
      description: |
        Sets `leftover` to the given whole number (0 means all eaten). The
        client sends the new absolute amount, not a change. `updatedAt` does
        not change.
      security:
        - adminPassword: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeftoverInput"
      responses:
        "200":
          description: The updated recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/WritesDisabled"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [recipes]
      operationId: clearLeftover
      summary: Clear how much of a recipe is left
      description: |
        Sets `leftover` to null (not recorded; also when it was already null).
        `leftoverUnit` is kept. `updatedAt` does not change.
      security:
        - adminPassword: []
      responses:
        "200":
          description: The updated recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/WritesDisabled"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/verify:
    post:
      tags: [auth]
      operationId: verifyPassword
      summary: Check the admin password
      description: |
        Lets the frontend check a password before remembering it. Changes
        nothing on the server.
      security:
        - adminPassword: []
      responses:
        "204":
          description: The password is correct. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/WritesDisabled"

components:
  securitySchemes:
    adminPassword:
      type: http
      scheme: bearer
      description: The admin password (ADMIN_PASSWORD on the server), sent as the bearer token.

  schemas:
    MealTime:
      type: string
      enum: [breakfast, lunch_dinner, snack]
      description: |
        - `breakfast`: 아침
        - `lunch_dinner`: 점심·저녁 (one option; the baby eats the same menu for both)
        - `snack`: 간식

    Ingredient:
      type: object
      additionalProperties: false
      required: [name, amount]
      properties:
        name:
          type: string
          example: 소고기
        amount:
          type: string
          description: Free text.
          example: 15g

    RecipeInput:
      type: object
      description: |
        Editable fields, sent on create and update. Only `name` is required;
        omitted fields default to empty. The frontend trims strings and drops
        ingredient rows where both name and amount are empty before sending.
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
          description: Must contain at least one non-whitespace character.
          example: 소고기 애호박 미음
        ingredients:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/Ingredient"
        instructions:
          type: string
          default: ""
        servings:
          type: string
          default: ""
          description: Free text.
          example: 3~4회분
        mealTimes:
          type: array
          default: []
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MealTime"
        notes:
          type: string
          default: ""
        leftoverUnit:
          type: string
          default: ""
          description: |
            Free text unit of the leftover amount; empty means the default
            (shown as "개"). The amount itself is set with `setLeftover`.
          example: 큐브

    Recipe:
      type: object
      description: A stored recipe. Every field is always present in responses.
      additionalProperties: false
      required:
        - id
        - name
        - ingredients
        - instructions
        - servings
        - mealTimes
        - notes
        - createdAt
        - updatedAt
        - pinnedAt
        - lastMadeOn
        - leftover
        - leftoverUnit
      properties:
        id:
          type: string
          description: Opaque, server-assigned identifier.
        name:
          type: string
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
        instructions:
          type: string
        servings:
          type: string
        mealTimes:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MealTime"
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        pinnedAt:
          type: [string, "null"]
          format: date-time
          description: When the recipe was pinned to the top of the list; null when not pinned.
        lastMadeOn:
          type: [string, "null"]
          format: date
          description: The day the recipe was last made; null when never recorded.
        leftover:
          type: [integer, "null"]
          minimum: 0
          maximum: 999
          description: How much of the made batch is left; null when not recorded.
        leftoverUnit:
          type: string
          description: Unit of `leftover`; empty means the default ("개").
      example:
        id: "1"
        name: 소고기 애호박 미음
        ingredients:
          - { name: 쌀가루, amount: 20g }
          - { name: 소고기, amount: 15g }
        instructions: 소고기를 핏물을 뺀 뒤 잘게 다집니다.
        servings: 3~4회분
        mealTimes: [breakfast, lunch_dinner]
        notes: 체에 한 번 걸러주면 훨씬 부드러워요.
        createdAt: "2026-09-10T08:00:00Z"
        updatedAt: "2026-09-29T08:00:00Z"
        pinnedAt: null
        lastMadeOn: "2026-10-11"
        leftover: 5
        leftoverUnit: 큐브

    LastMadeInput:
      type: object
      additionalProperties: false
      required: [lastMadeOn]
      properties:
        lastMadeOn:
          type: string
          format: date
          example: "2026-10-11"

    LeftoverInput:
      type: object
      additionalProperties: false
      required: [leftover]
      properties:
        leftover:
          type: integer
          minimum: 0
          maximum: 999
          description: A whole number; 0 means all eaten.
          example: 5

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          example: Recipe not found

    ValidationError:
      description: FastAPI's default request validation error body.
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string

  responses:
    Unauthorized:
      description: Wrong or missing password.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WritesDisabled:
      description: Writes are disabled because ADMIN_PASSWORD is not set on the server.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No recipe with this id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: The request failed validation (e.g. missing or blank `name`, unknown `mealTime`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
