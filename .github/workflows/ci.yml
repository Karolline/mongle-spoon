# Tests on every push and pull request.
#
# After the tests pass on main, the image job builds the Docker image once and
# pushes it to GHCR as sha-<commit> and dev, and deploy-dev tells the Render dev
# service to run it. A vX.Y.Z tag is added to that same image, never rebuilt
# (see the image and release-tag jobs). Prod gets an image only through
# promote.yml.

name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/karolline/mongle-spoon # GHCR names must be lowercase

jobs:
  backend:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no major-version tag (v10) is published
        with:
          python-version: "3.14" # same as the Docker image
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same major version as Neon in production.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mongle
          POSTGRES_PASSWORD: mongle
          POSTGRES_DB: mongle_spoon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mongle -d mongle_spoon_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://mongle:mongle@127.0.0.1:5432/mongle_spoon_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no major-version tag (v10) is published
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # same as the Docker image
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  image:
    name: Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, backend-postgres, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          docker build \
            --build-arg GIT_COMMIT="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGE:sha-${GITHUB_SHA::7}" \
            -t "$IMAGE:dev" \
            .
          docker push --all-tags "$IMAGE"
      # A release tag pushed before this point is picked up here. One pushed
      # after it is handled by the release-tag job of the tag's own run.
      - name: Tag release versions
        run: |
          for tag in $(git ls-remote --tags origin | awk -v sha="$GITHUB_SHA" '
              $1 == sha { sub(/^refs\/tags\//, "", $2); sub(/\^\{\}$/, "", $2); if ($2 ~ /^v/) print $2 }' | sort -u); do
            docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE:sha-${GITHUB_SHA::7}"
          done

  release-tag:
    name: Release image tag
    # The commit was already tested and built on main, so this only adds the
    # version tag to that image (same digest as what dev ran).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Tag the image of this commit
        run: |
          src="$IMAGE:sha-${GITHUB_SHA::7}"
          if docker buildx imagetools inspect "$src" > /dev/null 2>&1; then
            docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME" "$src"
          else
            echo "::notice::$src is not pushed yet. The image job of the main run adds $GITHUB_REF_NAME when it pushes it (rerun that run if it failed)."
          fi

  deploy-dev:
    name: Deploy to dev
    # The Render dev service runs the image, not the repo, so it deploys only
    # when this job calls its Deploy Hook. The environment records the
    # deployment, shown under Deployments on the repo page.
    needs: image
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Call the Render dev Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEV_DEPLOY_HOOK }}
        run: curl -fsS -X POST -G "$DEPLOY_HOOK" --data-urlencode "imgURL=$IMAGE:sha-${GITHUB_SHA::7}"
